[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governance_agent"
version = "0.4.0"
description = "OpenMetadata-native standalone AI Agent project using LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.1",
    "python-dotenv>=1.0",
    "data-ai-sdk>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
