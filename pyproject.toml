[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governance_agent"
version = "0.5.0"
description = "OpenMetadata-native standalone AI Agent project using LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.1",
    "python-dotenv>=1.0",
    "data-ai-sdk>=0.2.0,<0.3.0",
    "fastmcp>=2.14.7,<2.15",
    "celery[redis]>=5.4,<6",
    "langgraph-checkpoint-postgres>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# langgraph dev/up server tooling -- separate from runtime deps above since
# only `langgraph.json` + `app/langgraph_entry.py` need it (Studio UI / HTTP
# access to the graph), not the Celery worker or GovernanceAgentRunner paths.
server = [
    "langgraph-cli[inmem]>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
